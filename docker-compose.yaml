# Local convenience runner: `docker compose up --build`
# In production this FastAPI container would sit behind a load balancer /
# ingress, with its logs shipped to a central log store (see notes/13).

version: "3.9"

services:
  api:
    build: .
    image: mlops-autogluon-airquality:latest
    container_name: airquality-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PKL_PATH=artifacts/model_trainer/model.pkl
      - MODEL_VERSION=v1
    restart: unless-stopped

  mlflow:
    image: python:3.10-slim
    container_name: mlflow-server
    working_dir: /mlflow
    command: >
      bash -c "pip install --no-cache-dir mlflow &&
               mlflow server --host 0.0.0.0 --port 5000
               --backend-store-uri /mlflow/mlruns
               --default-artifact-root /mlflow/mlruns"
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
