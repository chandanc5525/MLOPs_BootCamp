# WHERE things live. See notes/07_dvc_pipeline.md for how this ties into dvc.yaml.

artifacts_root: artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  source_path: data/raw/air_quality.csv
  raw_data_file: artifacts/data_ingestion/raw_data.csv

data_validation:
  root_dir: artifacts/data_validation
  raw_data_file: artifacts/data_ingestion/raw_data.csv
  status_file: artifacts/data_validation/status.txt

data_transformation:
  root_dir: artifacts/data_transformation
  raw_data_file: artifacts/data_ingestion/raw_data.csv
  train_data_file: artifacts/data_transformation/train.csv
  test_data_file: artifacts/data_transformation/test.csv

model_trainer:
  root_dir: artifacts/model_trainer
  train_data_file: artifacts/data_transformation/train.csv
  model_dir: artifacts/model_trainer/autogluon_model
  model_pkl_file: artifacts/model_trainer/model.pkl

model_evaluation:
  root_dir: artifacts/model_evaluation
  test_data_file: artifacts/data_transformation/test.csv
  model_pkl_file: artifacts/model_trainer/model.pkl
  metric_file: artifacts/model_evaluation/metrics.json
